services:
  vi-iq:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      HOST: 0.0.0.0
      PORT: 3189
      STATE_PATH: /app/state/iq.sqlite
    ports:
      - "127.0.0.1:3189:3189"
    volumes:
      - iq-state:/app/state
    mem_limit: 384m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  iq-state:
